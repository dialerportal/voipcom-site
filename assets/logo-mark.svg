<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Voipcom mark">
  <!-- rotary dial ring, broken open at the top-right where the signal escapes -->
  <path d="M 58.3 19.8 A 30 30 0 1 0 71.0 28.7"
        fill="none" stroke="#23c37f" stroke-width="7" stroke-linecap="round"/>
  <!-- finger holes sweeping the bottom of the dial -->
  <circle cx="29.2" cy="54.8" r="4.6" fill="#eef5ef"/>
  <circle cx="36.5" cy="64.4" r="4.6" fill="#eef5ef"/>
  <circle cx="48.0" cy="68.0" r="4.6" fill="#eef5ef"/>
  <circle cx="59.5" cy="64.4" r="4.6" fill="#eef5ef"/>
  <circle cx="66.8" cy="54.8" r="4.6" fill="#eef5ef"/>
  <circle cx="67.3" cy="42.8" r="4.6" fill="#eef5ef"/>
  <!-- the last three holes break free as a rising signal -->
  <circle cx="59.5" cy="31.6" r="4.6" fill="#35f59b"/>
  <circle cx="65.2" cy="23.4" r="5.2" fill="#35f59b"/>
  <circle cx="71.5" cy="14.4" r="5.8" fill="#7dffc4"/>
  <!-- hub with live-status dot -->
  <circle cx="48" cy="48" r="9" fill="#23c37f"/>
  <circle cx="48" cy="48" r="3.2" fill="#06130c"/>
</svg>
